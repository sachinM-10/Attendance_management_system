server.port=8080
spring.application.name=leave-management-system

# Database Configuration
# Default: H2 in-memory MySQL compatibility mode for instant zero-config launch
# Override with MySQL credentials via environment variables:
#   DB_URL=jdbc:mysql://localhost:3306/leave_management_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   DB_DRIVER=com.mysql.cj.jdbc.Driver
#   DB_USERNAME=root
#   DB_PASSWORD=your_password
spring.datasource.url=${DB_URL:jdbc:h2:mem:leave_management_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console (Enabled for easy database browsing at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
app.jwt.expiration-ms=86400000
