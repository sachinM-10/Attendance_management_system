# Production Profile Configuration
server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=leave-management-system

# Database Configuration (H2 fallback, overridden by DB_URL for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:leave_management_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Disabled in production by default)
spring.h2.console.enabled=${ENABLE_H2_CONSOLE:false}

# JWT Security Secret & Expiration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
