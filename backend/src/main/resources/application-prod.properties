# Production Profile Configuration
server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=leave-management-system

# Database Configuration (Default MySQL with ENV overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leave_management_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Disabled in production by default)
spring.h2.console.enabled=${ENABLE_H2_CONSOLE:false}

# JWT Security Secret & Expiration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
